name: 🔒 CodeQL Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: 🔍 Analyze Security
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up security analysis environment
        run: |
          # Set required environment variables for builds during security analysis
          echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy_key_for_security_scan" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=dummy_key_for_security_scan" >> $GITHUB_ENV
          echo "NODE_ENV=production" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          # Clean npm cache to avoid stale conflicts
          npm cache clean --force
          
          # Install with legacy peer deps to resolve conflicts  
          npm ci --legacy-peer-deps --ignore-scripts
          
      - name: Build for analysis (optional)
        continue-on-error: true
        run: |
          # Use custom security build script for CodeQL analysis
          chmod +x ./scripts/security-build.sh
          ./scripts/security-build.sh
        env:
          # Set Node options to handle memory and legacy issues
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          output: sarif-results
          upload: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif

      - name: Security Analysis Summary
        if: always()
        run: |
          echo "## 🔒 Security Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Language: **${{ matrix.language }}**" >> $GITHUB_STEP_SUMMARY
          echo "Analysis completed at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results have been uploaded to the Security tab." >> $GITHUB_STEP_SUMMARY